# ============================================================
# Docker Compose / Podman Compose File
# Complete Three-Service Stack (Ollama + Backend + Frontend)
# ============================================================
#
# QUICK START & STOP COMMANDS:
# ----------------------------
# 1. Start all 3 services together:
#      podman-compose up -d
#
# 2. Stop all 3 services together:
#      podman-compose down
#
# 3. First-time model pull (one-time setup):
#      podman exec -it ollama ollama pull qwen2.5-coder:7b
# ============================================================

version: '3.8'

services:
  # ------------------------------------------------------------
  # 1. Ollama LLM Service (Runs inside Podman)
  # ------------------------------------------------------------
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    volumes:
      - /home/hit235/.ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------
  # 2. FastAPI Backend Service (Data Analyst API & Sandbox)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: offline-analyst-backend
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=Offline AI Data Analyst
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - CHAT_REQUEST_TIMEOUT_SECONDS=${CHAT_REQUEST_TIMEOUT_SECONDS:-120}
      - WORKSPACE_DIR=/app/workspace
      - DATASETS_DIR=/app/datasets
      - METADATA_DB_URL=sqlite:////app/workspace/metadata.db
    volumes:
      - ./server:/app/server        # Live-mount source code for hot reload
      - ./workspace:/app/workspace
      - ./datasets:/app/datasets
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------
  # 3. React Frontend Service (Web Interface)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: build               # Use Node stage (not nginx) for dev
      args:
        - VITE_API_URL=http://localhost:8001/api/v1
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
    container_name: offline-analyst-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app              # Live-mount source code for hot reload
      - /app/node_modules          # Preserve container's node_modules
    command: npx vite --host 0.0.0.0 --port 3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

