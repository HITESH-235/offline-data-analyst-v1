<text x="45" y="24" class="node-title">Execution evidence</text>
<text x="16" y="48" class="detail">Output identities + provenance</text>
<text x="16" y="65" class="detail">Contributors · exclusions · units</text>
</g>
<g transform="translate(336 278)">
