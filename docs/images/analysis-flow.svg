<path d="M0 0H246L256 10V90H10L0 80Z" fill="#0D141E" stroke="#2B3C52"/>
<path d="M0 0H34" stroke="#409CFF" stroke-width="2"/>
<text x="16" y="23" class="number">04</text>
<text x="45" y="24" class="node-title">Structural validation</text>
<text x="16" y="48" class="detail">Schema · relationships · grain</text>
<text x="16" y="65" class="detail">Declared follow-up changes</text>
</g>
<g transform="translate(912 278)">
<path d="M0 0H246L256 10V92H10L0 82Z" fill="#0D141E" stroke="#2B3C52"/>
<path d="M0 0H34" stroke="#409CFF" stroke-width="2"/>
