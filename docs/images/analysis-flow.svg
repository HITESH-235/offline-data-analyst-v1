<path d="M0 0H34" stroke="#409CFF" stroke-width="2"/>
<text x="16" y="23" class="number">07</text>
<text x="45" y="24" class="node-title">Publication gate</text>
<text x="16" y="48" class="detail">Requirements · scope · evidence</text>
<text x="16" y="65" class="detail">Completion decision</text>
</g>
<g transform="translate(32 278)">
<path d="M0 0H246L256 10V92H10L0 82Z" fill="#0D141E" stroke="#2B3C52"/>
<path d="M0 0H34" stroke="#409CFF" stroke-width="2"/>
